services:
  postgres:
    image: postgres:16
    container_name: terminus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: terminus
      POSTGRES_PASSWORD: terminus
      POSTGRES_DB: terminus
    ports:
      - "5432:5432"
    volumes:
      - terminus_postgres_data:/var/lib/postgresql/data

volumes:
  terminus_postgres_data:
