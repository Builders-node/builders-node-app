name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the migration job be run without a code push — for the first run after
  # the DIRECT_URL secret is added, and any time a deploy got ahead of the
  # schema. GitHub → Actions → CI → Run workflow.
  workflow_dispatch:

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    # A throwaway Postgres for the drift check below — `migrate diff` replays
    # every migration into it to see what they add up to. Never a real
    # database: it exists for the length of this job and holds nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # schema.prisma and the migrations folder are written by hand, separately,
      # and nothing checked they agree: a field added to the schema without a
      # migration builds, passes every test, and then 500s in production
      # because the column was never created. This replays the migrations into
      # the throwaway database and fails (exit 2) if the result differs from the
      # schema at all, printing the SQL that would close the gap.
      #
      # Runs before the migrate job (which needs this one), so a drifted
      # migration never reaches the real database.
      - name: Check schema.prisma matches the migrations
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --script
          --exit-code
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
          # The schema's datasource names these; the diff never connects to
          # them, but Prisma refuses to load a schema whose env() is unset.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - run: npm run build
      - run: npm test

  # Migrations used to be a manual step, and the code shipped without them
  # three times running: Vercel deploys on push, the schema didn't, and every
  # endpoint touching a new table answered 500 until somebody remembered.
  #
  # Run here rather than in the Vercel build, which is what the manual rule was
  # avoiding: a build runs per deployment and several can overlap, where this
  # job runs once per push to main, after the tests that would have caught a bad
  # migration. `migrate deploy` only applies what isn't recorded yet, so a
  # re-run is a no-op.
  migrate:
    name: Database — apply migrations
    needs: backend
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      # The direct 5432 connection, not the pooler: pgbouncer can't run DDL.
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
